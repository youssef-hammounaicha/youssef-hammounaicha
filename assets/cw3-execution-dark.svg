<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="YOUSSEF HAMMOUNAICHA execution deck" data-mode="dark">
      <defs>
    <linearGradient id="industrial-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07131A"/><stop offset="1" stop-color="#10141F"/></linearGradient>
    <linearGradient id="industrial-accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#C4CBD4"/><stop offset="1" stop-color="#94A3B8"/></linearGradient>
    <pattern id="industrial-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17313C" stroke-width="1"/></pattern>
