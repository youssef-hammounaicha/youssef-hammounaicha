<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
<title id="title">Project signal monitor for Youssef Hammounaicha</title>
<desc id="desc">Three monochrome project signals: CW3 in development and private, ATELIER 01 prototype, and 3D LAB experimental.</desc>
<style>
  text{font-family:Arial,Helvetica,sans-serif;fill:#e8ecf0}.mono{font-family:Consolas,monospace}.muted{fill:#777f8b}.line{stroke:#303740}.panel{fill:#15181d;stroke:#303740}.signal{fill:#c4cbd4;animation:pulse 2.4s ease-in-out infinite}.p1{animation-delay:.2s}.p2{animation-delay:.4s}.row{animation:appear .5s ease-out both}.r1{animation-delay:.2s}.r2{animation-delay:.4s}.r3{animation-delay:.6s}.load{animation:load 2.8s steps(4,end) infinite}.cursor{animation:blink 1.1s steps(2,end) infinite}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{opacity:.35}}@keyframes blink{50%{opacity:0}}@keyframes load{0%{opacity:.25}50%{opacity:1}100%{opacity:.25}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="960" height="430" fill="#08090b"/><path d="M0 54H960M0 414H960" class="line"/>
<text x="38" y="34" font-size="12" class="mono muted">PROJECT SIGNAL MONITOR / PUBLIC SURFACE</text><text x="826" y="34" font-size="12" class="mono muted">03 CHANNELS</text>
<g class="row r1"><rect x="32" y="78" width="896" height="88" rx="2" class="panel"/><circle cx="58" cy="108" r="5" class="signal"/><text x="78" y="111" font-size="16" class="mono">CW3</text><text x="78" y="137" font-size="13" class="muted">WAREHOUSE MANAGEMENT / DIGITAL TWIN</text><text x="686" y="108" font-size="11" class="mono muted">STATUS: IN DEVELOPMENT</text><text x="686" y="136" font-size="11" class="mono muted">ACCESS: PRIVATE</text><path d="M510 151h104M622 151h18M648 151h28" stroke="#c4cbd4" stroke-width="2"/></g>
<g class="row r2"><rect x="32" y="180" width="896" height="88" rx="2" class="panel"/><circle cx="58" cy="210" r="5" class="signal p1"/><text x="78" y="213" font-size="16" class="mono">ATELIER 01</text><text x="78" y="239" font-size="13" class="muted">ARCHITECTURAL DIGITAL EXPERIENCE</text><text x="686" y="210" font-size="11" class="mono muted">STATUS: PROTOTYPE</text><text x="686" y="238" font-size="11" class="mono muted">SIGNAL: <tspan class="load">LOADING...</tspan></text><path d="M510 253h52M570 253h30M608 253h58" stroke="#c4cbd4" stroke-width="2"/></g>
<g class="row r3"><rect x="32" y="282" width="896" height="88" rx="2" class="panel"/><circle cx="58" cy="312" r="5" class="signal p2"/><text x="78" y="315" font-size="16" class="mono">3D LAB</text><text x="78" y="341" font-size="13" class="muted">REAL-TIME 3D / VISUALIZATION</text><text x="686" y="312" font-size="11" class="mono muted">STATUS: EXPERIMENTAL</text><text x="686" y="340" font-size="11" class="mono muted">SIGNAL: STABLE</text><path d="M510 355h34M552 355h73M633 355h22" stroke="#c4cbd4" stroke-width="2"/></g>
<text x="38" y="401" font-size="11" class="mono muted">MONITOR READY <tspan class="cursor">_</tspan></text>
</svg>
