<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc" data-mode="light"><title id="title">CW3 public execution signal</title><desc id="desc">Terminal-style public status for CTRLZ Warehouse 3D.</desc><style>text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}.fade{animation:fade .45s cubic-bezier(.23,1,.32,1) both}.pulse{animation:pulse 2.4s ease-in-out infinite}.scan{animation:scan 5s ease-in-out infinite}@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{opacity:.32;transform:scale(.72)}}@keyframes scan{50%{opacity:.25;transform:translateX(26px)}}@media(prefers-reduced-motion:reduce){.fade,.pulse,.scan{animation:none}}</style><rect width="960" height="250" rx="12" fill="#F4F5F6"/><rect x="1" y="1" width="958" height="248" rx="12" fill="none" stroke="#C8CDD3"/><path d="M0 42H960M640 42V250" stroke="#C8CDD3"/><circle cx="22" cy="21" r="4" fill="#B8BEC7"/><text x="38" y="26" font-size="13" letter-spacing="2" fill="#626A74">CW3 / PUBLIC EXECUTION LOG</text><text x="930" y="26" text-anchor="end" font-size="11" fill="#626A74">STATUS: IN DEVELOPMENT</text><g class="fade"><text x="28" y="78" font-size="12" letter-spacing="2" fill="#626A74">$ phase --current</text><text x="28" y="112" font-size="24" font-weight="700" fill="#15171B">NOT PUBLISHED</text><text x="28" y="146" font-size="12" fill="#626A74">last update / NOT RECORDED</text><path d="M28 178H590" stroke="#C8CDD3"/><path class="scan" d="M28 178H180" stroke="#B8BEC7" stroke-width="2"/></g><g class="fade"><text x="676" y="78" font-size="12" letter-spacing="2" fill="#626A74">$ report --latest</text><text x="676" y="112" font-size="14" fill="#15171B">NO PUBLIC REPORTS</text><text x="676" y="150" font-size="12" fill="#626A74">reports / 00</text><text x="676" y="176" font-size="12" fill="#626A74">milestones / 00</text><circle class="pulse" cx="918" cy="178" r="4" fill="#B8BEC7"/></g></svg>