<svg xmlns="http://www.w3.org/2000/svg" width="720" height="610" viewBox="0 0 720 610" role="img" aria-labelledby="title desc">
<title id="title">Project signal monitor</title><desc id="desc">Monochrome project monitoring panel for CW3, ATELIER 01 and 3D LAB.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#e8ecf0}.mono{font-family:Consolas,monospace}.muted{fill:#777f8b}.line{stroke:#303740}.panel{fill:#15181d;stroke:#303740}.signal{fill:#c4cbd4;animation:pulse 2.4s ease-in-out infinite}.p1{animation-delay:.2s}.p2{animation-delay:.4s}.row{animation:appear .5s ease-out both}.r1{animation-delay:.2s}.r2{animation-delay:.4s}.r3{animation-delay:.6s}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes pulse{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="720" height="610" fill="#08090b"/><path d="M0 54H720M0 594H720" class="line"/><text x="28" y="34" font-size="12" class="mono muted">PROJECT SIGNAL MONITOR</text>
<g class="row r1"><rect x="24" y="76" width="672" height="145" rx="2" class="panel"/><circle cx="48" cy="106" r="5" class="signal"/><text x="68" y="110" font-size="16" class="mono">CW3</text><text x="40" y="145" font-size="13" class="muted">WAREHOUSE MANAGEMENT / DIGITAL TWIN</text><text x="40" y="177" font-size="11" class="mono muted">STATUS: IN DEVELOPMENT</text><text x="40" y="198" font-size="11" class="mono muted">ACCESS: PRIVATE</text></g>
<g class="row r2"><rect x="24" y="235" width="672" height="145" rx="2" class="panel"/><circle cx="48" cy="265" r="5" class="signal p1"/><text x="68" y="269" font-size="16" class="mono">ATELIER 01</text><text x="40" y="304" font-size="13" class="muted">ARCHITECTURAL DIGITAL EXPERIENCE</text><text x="40" y="336" font-size="11" class="mono muted">STATUS: PROTOTYPE</text></g>
<g class="row r3"><rect x="24" y="394" width="672" height="145" rx="2" class="panel"/><circle cx="48" cy="424" r="5" class="signal p2"/><text x="68" y="428" font-size="16" class="mono">3D LAB</text><text x="40" y="463" font-size="13" class="muted">REAL-TIME 3D / VISUALIZATION</text><text x="40" y="495" font-size="11" class="mono muted">STATUS: EXPERIMENTAL</text></g><text x="28" y="580" font-size="11" class="mono muted">MONITOR READY</text></svg>
